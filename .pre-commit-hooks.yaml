- id: quest-format
  name: quest-format
  description: Normalize quest frontmatter formatting (arrays, date quoting, quote style).
  entry: quest-format
  language: python
  files: (^|/)QST-[^/]+\.md$
  pass_filenames: true

- id: quest-validate
  name: quest-validate
  description: Validate quest frontmatter against the questkit schema.
  entry: quest-validate
  language: python
  files: (^|/)QST-[^/]+\.md$
  pass_filenames: true

- id: quest-bump-modified
  name: quest-bump-modified
  description: Bump `modified` to today, and backfill `status_changed` when a raw edit changed `status`.
  entry: quest-bump-modified
  language: python
  files: (^|/)QST-[^/]+\.md$
  pass_filenames: true
  verbose: true
