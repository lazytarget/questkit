[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "questkit"
version = "0.2.0"
description = "File-based quest tracking: Markdown + YAML frontmatter tickets, for humans and agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Peter Åslund" }]
dependencies = [
  "ruamel.yaml>=0.18",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "ruff>=0.4.0",
  "mypy>=1.10",
  "pre-commit>=3.7.0",
]

[project.scripts]
quest = "questkit.cli:main"
qst = "questkit.cli:main"
quest-format = "questkit.hooks:format_main"
quest-validate = "questkit.hooks:validate_main"
quest-bump-modified = "questkit.hooks:bump_modified_main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["src/questkit"]
warn_redundant_casts = true
warn_unused_ignores = true
# ruamel.yaml's CommentedMap is a dict subclass with no useful stubs, and
# frontmatter is untyped by nature -- `disallow_untyped_defs` would mean
# annotating every `_check_*(path, fm, ...)` helper with `Any`, which buys
# nothing. The value here is catching the real class of bug mypy already
# found: `str | None` flowing into a `str` parameter.
disallow_untyped_defs = false
ignore_missing_imports = true
