name: Publish

# On a version tag: build the package and upload it to a PyPI-compatible
# package registry (Gitea's, for now). GitHub / PyPI publishing is out of
# scope until 0.9.0.
#
# This job is meant for a self-hosted Gitea Actions runner: a registry behind
# a private network is not reachable from GitHub-hosted runners, so the job
# is skipped wherever PYPI_REGISTRY_URL is not set (e.g. on github.com).
#
# Configure in the Gitea repository settings (Actions):
#   variable PYPI_REGISTRY_URL    https://<gitea-host>/api/packages/<owner>/pypi
#   secret   PYPI_REGISTRY_USER   the registry owner's user name
#   secret   PYPI_REGISTRY_TOKEN  that user's access token, scope write:package
# (Gitea reserves the GITEA_ and GITHUB_ prefixes for secret and variable names.)
# No artifact upload/download actions are used: v4 of those is not supported
# by Gitea Actions, so build and upload happen in one job.

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.PYPI_REGISTRY_URL != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Tag matches pyproject version
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - name: Upload to the package registry
        env:
          TWINE_REPOSITORY_URL: ${{ vars.PYPI_REGISTRY_URL }}
          TWINE_USERNAME: ${{ secrets.PYPI_REGISTRY_USER }}
          TWINE_PASSWORD: ${{ secrets.PYPI_REGISTRY_TOKEN }}
        run: twine upload dist/*
