name: Publish to the Gitea registry

# On a version tag: build the package and upload it to Gitea's PyPI-compatible
# package registry. Publishing to PyPI is publish-pypi.yml, and the two never
# share credentials.
#
# Gitea's runner also reads this directory, and so does GitHub's, so this job
# is guarded both ways: it needs PYPI_REGISTRY_URL to be set (a registry behind a
# private network is not reachable from GitHub-hosted runners) and it never runs
# on github.com, even if someone sets the variable there.
#
# Configure in the Gitea repository settings (Actions):
#   variable PYPI_REGISTRY_URL    https://<gitea-host>/api/packages/<owner>/pypi
#   secret   PYPI_REGISTRY_USER   the registry owner's user name
#   secret   PYPI_REGISTRY_TOKEN  that user's access token, scope write:package
# (Gitea reserves the GITEA_ and GITHUB_ prefixes for secret and variable names.)
# No artifact upload/download actions are used: v4 of those is not supported
# by Gitea Actions, so build and upload happen in one job.

# A manual run (Actions tab, Run workflow; available once this file is on the
# default branch) is a dry run of the same path: it publishes a `.devN`
# pre-release of the current version and never the real version number, which a
# registry will not let you overwrite.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    if: ${{ vars.PYPI_REGISTRY_URL != '' && github.server_url != 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install build twine
      - name: Use a dev version for manual runs
        if: ${{ github.ref_type != 'tag' }}
        run: |
          sed -i -E 's/^version = "([^"]+)"/version = "\1.dev${{ github.run_number }}"/' pyproject.toml
          grep -n '^version' pyproject.toml
      - name: Tag matches pyproject version
        if: ${{ github.ref_type == 'tag' }}
        run: |
          version=$(python -c "import tomllib;print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "tag $GITHUB_REF_NAME does not match pyproject version $version" >&2
            exit 1
          fi
      - run: python -m build
      - run: twine check dist/*
      - name: Upload to the package registry
        env:
          TWINE_REPOSITORY_URL: ${{ vars.PYPI_REGISTRY_URL }}
          TWINE_USERNAME: ${{ secrets.PYPI_REGISTRY_USER }}
          TWINE_PASSWORD: ${{ secrets.PYPI_REGISTRY_TOKEN }}
        run: twine upload dist/*
