# questkit is its own quest tracker, so its hooks must run the **working tree**,
# not a pinned release of itself.
#
# This file used to pin `ssh://.../questkit.git` at a rev, exactly as every
# consuming repo does. That is correct for a consumer and self-defeating here:
# any change to a vocabulary means this repo's own quests are validated by the
# *previous* release, which does not know the new values. Renaming
# `status: completed` to `done` was unlandable -- the hook rejected the very
# files the commit was migrating, and the rev that would accept them cannot
# exist until after the commit.
#
# `language: system` + `.venv/bin/...` resolves it: `.venv` is an editable
# install (see docs §4.1), so the hooks always exercise the code being
# committed. Requires that dev venv to exist, which developing questkit
# requires anyway.
#
# Consuming repos should keep pinning a released rev -- they want a stable
# contract, not questkit's HEAD.
# `pre-commit install` installs both stages.
default_install_hook_types: [pre-commit, pre-push]
# Hooks run on commit unless they say otherwise; the quest hooks rewrite files.
default_stages: [pre-commit]

repos:
  # Credentials: tokens, keys and high-entropy strings, in the staged diff.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.24.2
    hooks:
      - id: gitleaks

  - repo: local
    hooks:
      # Names, employers and hosts you want private. The deny-list lives OUTSIDE
      # the repository (see scripts/sensitive_scan.py); with no list configured
      # these hooks pass, so contributors are never blocked by them.
      - id: sensitive-scan
        name: sensitive-scan (staged changes)
        entry: .venv/bin/python scripts/sensitive_scan.py staged
        language: system
        pass_filenames: false
        always_run: true

      - id: sensitive-scan-push
        name: sensitive-scan (commits being pushed)
        entry: .venv/bin/python scripts/sensitive_scan.py push --pre-commit
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]

      - id: quest-format
        name: quest-format
        description: Normalize quest frontmatter formatting (arrays, date quoting, quote style).
        entry: .venv/bin/quest-format
        language: system
        files: (^|/)QST-[^/]+\.md$
        pass_filenames: true

      - id: quest-validate
        name: quest-validate
        description: Validate quest frontmatter against the questkit schema.
        entry: .venv/bin/quest-validate
        language: system
        files: (^|/)QST-[^/]+\.md$
        pass_filenames: true

      - id: quest-bump-modified
        name: quest-bump-modified
        description: Bump a quest's `modified` date to today when it changes.
        entry: .venv/bin/quest-bump-modified
        language: system
        files: (^|/)QST-[^/]+\.md$
        pass_filenames: true
        verbose: true
