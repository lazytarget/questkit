# The `development` schema: work that is software.
#
# Used by questkit's own quest log (`quests/.questkit.yaml` extends this file
# by relative path). Another log can adopt it the same way, or copy it into a
# shared schema directory on `QST_SCHEMA_PATH` and write `schema: development`.
#
# Vocabularies are inherited from questkit's core; this file adds only the
# fields that are meaningless outside software, plus `milestone`.

fields:
  # Which part of the system. Left as free text rather than an enum because
  # different logs have different component vocabularies, and one shared enum
  # would be wrong for all of them -- a per-log `fields.component.values`
  # override is the way to close it.
  component:
    type: string

  # ADR references, as free-form strings. Carried over from the Beans-era
  # migration; not an enum, not validated beyond presence.
  related_adrs:
    type: string

  # Whether this work can run unsupervised. Demoted out of the core schema in
  # v0.3: `afk|hitl` is not a universal vocabulary — non-software work has no
  # unsupervised-agent axis, so shipping one in the core is questkit having an
  # opinion about what kind of work its users do.
  agentic:
    type: enum
    values: [afk, hitl]

  # A planning bucket, free text (`0.4.0`, `spring-2027`). Named `milestone`
  # rather than `planned_version` because it is a bucket that can slip, not a
  # fact — and rather than `version`, which would read as "which questkit
  # version" beside the config's own `version: 1`.
  #
  # NOT a membership link. questkit has no parent/child concept and v0.3 does
  # not add one; an epic's Scope table stays prose.
  milestone:
    type: string

# `views:` fully replaces questkit's built-in map (same "sibling key, full
# replacement" rule as `statuses:`/`readiness:`), so the four defaults are
# restated here verbatim -- adding `milestone` must not silently drop
# `next`/`stale`/`blocked`/`default` for every log that adopts this schema.
#
# `milestone` is a burnup-ready prefill: every quest with a milestone set,
# newest milestone first and (within one milestone) draft-to-done declared
# status order -- "which milestone" needs no view parameter of its own,
# since --where on milestone already overrides this view's own clause
# (two-layer precedence, same rule every other view follows). Pair with
# --group-by (QST-oguay) for the actual burnup counts:
#
#   quest list --view milestone --where "milestone=0.4.0"
#   quest list --view milestone --group-by milestone,status
views:
  default: { where: ["status=todo,in-progress"] }
  next: { where: ["blocked=false"], sort: "priority:asc,effort:asc,idle:desc", limit: 1 }
  stale: { where: ["idle>14"], sort: "idle:desc" }
  blocked: { where: ["blocked=true"], sort: "blocks:desc" }
  milestone:
    where: ["milestone:exists"]
    sort: "milestone:desc,status:asc"
  # Dated quests, soonest-due first -- questkit core's own built-in
  # (QST-nij1y), restated here for the same reason `milestone` already is:
  # `views:` fully replaces the built-in map, so every log adopting this
  # schema needs it spelled out or it silently loses `quest list --view due`.
  due:
    where: ["due:exists"]
    sort: "due_in:asc"

# `readiness:` fully replaces questkit's built-in list (same "sibling key,
# full replacement" rule as `views:`/`statuses:`), so the four universal
# rules are restated here verbatim -- adopting a per-type rule must not
# silently drop the description/grooming/spec/acceptance-criteria bar every
# other log still gets for free.
#
# QST-z1exq adds one `when:`-guarded rule: `type=bug` needs a `## Repro`
# section before the brief reads READY -- a bug report with no repro steps
# is not implementation-ready, and this is a grooming judgment (advisory,
# via `quest brief`), not a `quest validate` hard rule. `epic` requiring a
# `## Scope` section was considered and deliberately left out: only 5 of 22
# epics in the corpus at authoring time actually carried one, which is
# describing a habit nobody has yet rather than one the corpus already
# supports.
readiness:
  - require: { where: "description:exists" }
    message: "no description"
  - require: { where: "status!=draft" }
    message: "still a draft -- not groomed"
  - require: { sections: ["## Spec", "## Design"] }
    message: "no spec or design section"
  - require: { checklist: "## Acceptance Criteria", min: 1 }
    message: "no acceptance criteria"
  - when: "type=bug"
    require: { sections: ["## Repro"] }
    message: "no repro steps -- not implementation-ready"
